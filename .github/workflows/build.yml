name: Собрать APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Скачать дополнительные шрифты
        run: bash scripts/fetch-fonts.sh || true

      - name: Собрать
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Подготовить файл
        run: cp app/build/outputs/apk/release/app-release.apk Polka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Polka-apk
          path: Polka.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Полка — сборка ${{ github.run_number }}
          body: Скачай Polka.apk на телефон и установи.
          files: Polka.apk
          make_latest: true
